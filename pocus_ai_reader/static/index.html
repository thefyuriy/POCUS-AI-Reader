<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>POCUS AI Reader</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="chrome">
    <div class="topbar">
      <a class="wordmark" href="#/">POCUS AI Reader</a>
      <nav class="topnav" aria-label="Library tools">
        <a class="btn" id="btn-home" href="#/">All exams</a>
        <button class="btn quiet" id="btn-import" type="button">Import library</button>
        <button class="btn quiet" id="btn-export" type="button">Export library</button>
        <button class="btn quiet" id="btn-folder" type="button">Library folder</button>
      </nav>
    </div>
    <p class="banner" role="note">
      For research and teaching only, not for clinical decisions. The AI model used here was trained on
      consultative echocardiograms, not point-of-care clips.
    </p>
    <div id="jobbar" class="jobbar" role="status" hidden></div>
  </header>

  <main id="app" tabindex="-1"></main>

  <div id="veil" class="veil" hidden>
    <p>Drop files or a folder to add them</p>
  </div>
  <div id="modal-root"></div>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <input id="file-input" type="file" multiple hidden
         accept=".mp4,.m4v,.mov,.avi,.webm,.jpg,.jpeg,.png,.gif">
  <input id="zip-input" type="file" accept=".zip,application/zip" hidden>

  <script src="/static/app.js"></script>
</body>
</html>
